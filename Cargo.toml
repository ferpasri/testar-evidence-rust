[package]
name = "testar-state-model"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
description = "Framework-independent state models and portable execution evidence"
readme = "README.md"

[dependencies]
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
sha2 = "0.10.9"

[dev-dependencies]
xtask = { path = "xtask" }
tempfile = "3.22.0"

[workspace]
members = ["xtask"]
default-members = ["."]
