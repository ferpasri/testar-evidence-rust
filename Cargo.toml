[package]
name = "testar-evidence"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
description = "Framework-independent recording and reading of portable test execution evidence"
readme = "README.md"

[dependencies]
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
sha2 = "0.10.9"

[dev-dependencies]
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }
uuid = { version = "=1.18.1", features = ["v4"] }
xtask = { path = "xtask" }
tempfile = "3.22.0"

[workspace]
members = ["xtask"]
default-members = ["."]
