[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.22.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
